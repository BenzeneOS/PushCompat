[package]
name        = "pushcompat-bridge"
version     = "0.1.0"
edition     = "2024"
description = "Bridge server which receives FCM messages and forwards them as UnifiedPush."
license     = "MIT"
repository  = "https://github.com/BenzeneOS/pushcompat"
readme      = "README.md"
keywords    = [ "fcm", "unifiedpush", "android" ]
categories  = [ "network-programming" ]

[dependencies]
aes-gcm.workspace             = true
anyhow.workspace              = true
axum.workspace                = true
data-encoding.workspace       = true
fastwebsockets.workspace      = true
futures-util.workspace        = true
hkdf.workspace                = true
hmac.workspace                = true
p256                          = { workspace = true, features = [ "ecdsa" ] }
pound.workspace               = true
pushcompat-listener.workspace = true
rand.workspace                = true
reqwest.workspace             = true
rusqlite.workspace            = true
serde.workspace               = true
serde_json.workspace          = true
sha2.workspace                = true
subtle.workspace              = true
tokio.workspace               = true
tokio-rusqlite.workspace      = true
tracing.workspace             = true
tracing-subscriber.workspace  = true

[lints]
workspace = true
