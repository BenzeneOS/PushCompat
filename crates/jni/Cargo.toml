[package]
name        = "pushcompat-jni"
version     = "0.1.0"
edition     = "2024"
description = "JNI boundary for the PushCompat listener"
license     = "MIT"
repository  = "https://github.com/BenzeneOS/pushcompat"
readme      = "README.md"
keywords    = [ "jni", "android", "push-notifications" ]
categories  = [ "api-bindings" ]

[lib]
crate-type = [ "cdylib" ]
name       = "pushcompat_jni"
path       = "src/lib.rs"

[dependencies]
jni.workspace                 = true
pushcompat-listener.workspace = true
reqwest.workspace             = true
serde.workspace               = true
serde_json.workspace          = true
tokio.workspace               = true
tokio-stream.workspace        = true
